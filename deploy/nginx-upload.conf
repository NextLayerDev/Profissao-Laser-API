# Configuração Nginx para uploads de vídeos grandes
# Aplicar no Easypanel em /data/nginx/user_conf.d/ ou via UI de config customizada
# para o serviço profissao-laser-back (backend API)

# Limite de tamanho do body (1GB - alinhado ao limite do @fastify/multipart)
client_max_body_size 1024M;

# Timeouts para uploads longos (30 min)
client_body_timeout 1800s;
proxy_connect_timeout 1800s;
proxy_send_timeout 1800s;
proxy_read_timeout 1800s;
send_timeout 1800s;
