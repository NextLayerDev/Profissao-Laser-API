name: 🚀 CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  NODE_VERSION: "24"

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: 📦 Install dependencies
        run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 린 Lint check
        run: npx biome check .

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 🏗️ Build application
        run: npm run build

  security:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: 🔒 Run NPM Audit (apenas deps de produção)
        # --omit=dev: audita só o que vai pra produção. Vulns de ferramentas de
        # dev/teste (vitest/esbuild — não rodam no servidor) não barram o deploy.
        run: npm audit --omit=dev --audit-level=critical

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push'
    steps:
      - name: 🚀 Deploy to EasyPanel (main)
        if: github.ref_name == 'main'
        run: curl -s -X GET "${{ secrets.EASYPANEL_DEPLOY_MAIN }}"

      - name: 🚀 Deploy to EasyPanel (dev)
        if: github.ref_name == 'dev'
        run: curl -s -X GET "${{ secrets.EASYPANEL_DEPLOY_DEV }}"
